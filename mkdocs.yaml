site_name: hyperfine
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggestions
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - include-markdown
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [hyperfine]
          options:
            show_root_heading: true
            heading_level: 2
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tutorials:
      - The Dark Ages: tutorials/dark-ages.md
      - The Cosmic Dawn: tutorials/cosmic-dawn.md
      - Derivatives of the 21cm Signal: tutorials/derivatives.md 
  - Modelling the 21cm Signal: 
      - Global Signal: modelling/intro.md
      - The Dark Ages: modelling/the-dark-ages.md
      - The Gas temperature and Neutral Fraction up to z=50: modelling/recombination/hyrec_emulators.md
      - Lyman-alpha Flux: modelling/wouthuysen.md
      - X-ray Heating: modelling/xrays.md
      - The Gas temperature and Neutral Fraction during the Cosmic Dawn: modelling/recombination/cosmic-dawn.md
  - API Reference: api-reference.md
