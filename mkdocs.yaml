site_name: hyperfine
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggestions
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - include-markdown
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [hyperfine]
          options:
            show_root_heading: true
            heading_level: 2
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tutorials: tutorials.md
  - Modelling the 21cm Signal: 
      - Global Signal: modelling/intro.md
      - The Dark Ages: modelling/the-dark_ages.md
      - Recombination, Neutral Fraction, and the Gas Temperature:
        - HYREC-2 Emulator: modelling/recombination/hyrec_emulators.md
        - Cosmic Dawn: modelling/recombination/cosmic-dawn.md
      - Lyman-alpha Flux: modelling/wouthuysen.md
      - X-ray Heating: modelling/xrays.md
  - API Reference: api-reference.md
